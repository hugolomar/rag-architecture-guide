[pytest]
pythonpath = .
addopts = --strict-markers
# The release gate is omitted here. Local runs and pull-request CI must not
# score the protected suite. Invoke evals/runners/test_release_gate.py explicitly.
testpaths =
    evals/test_suite_integrity.py
    evals/test_harness_selfcheck.py
    evals/runners/test_retrieval_dev.py
    evals/runners/test_regression_val.py
markers =
    dev: Development suite tests (14 cases)
    validation: Pull-request CI regression suite tests (6 cases)
    release_gate: Protected hold-out suite for release gating (7 cases)
    retrieval: Phase 1 retrieval-focused case
    security: Security trimming and RBAC boundary case
    generation: Phase 2 generation-focused case
    end_to_end: Full retrieval and generation case
    hybrid_search: Lexical + dense hybrid retrieval category
    tabular_chunking: Table preservation category
    security_rbac: Role-based access control category
    lifecycle_freshness: Document lifecycle and version freshness category
    semantic_neighbor: Allowed vs restricted neighbor isolation category
    multi_document: Cross-document reasoning category
    adversarial: Prompt injection and spoofing category
    abstention: Out-of-corpus or unsupported benefit abstention category
    edge_conditions: Multi-condition edge query category
    edge_ambiguity: Ambiguous policy requiring clarification category
    edge_query: Noisy/typo query category
