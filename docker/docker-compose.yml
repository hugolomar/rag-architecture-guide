name: rag-pipeline

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: rag-keycloak
    command: start-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingestion
    image: rag-ingestion:local
    container_name: rag-ingestion-batch
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - RAG_DATA_DIR=/app/data/raw
      - RAG_MANIFEST_PATH=/app/data/manifest.json
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=governed_docs
      - DENSE_MODEL_NAME=${DENSE_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      - EMBEDDING_BATCH_SIZE=32
      - LOG_LEVEL=INFO
    volumes:
      - ../data:/app/data:ro

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: rag-api:local
    container_name: rag-query-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=governed_docs
      - DENSE_MODEL_NAME=${DENSE_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=master
      - LOG_LEVEL=INFO

volumes:
  qdrant_storage:
