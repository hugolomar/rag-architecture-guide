services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ingestion
    container_name: rag-ingestion-batch
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - RAG_DATA_DIR=/app/data/raw
      - RAG_MANIFEST_PATH=/app/data/manifest.json
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=governed_docs
      - LOG_LEVEL=INFO
    volumes:
      - ../data:/app/data:ro

volumes:
  qdrant_storage:

