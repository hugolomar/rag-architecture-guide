[project]
name = "rag-architecture-guide"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-frontmatter>=1.1",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.13.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "testcontainers>=4.15.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "UP",    # pyupgrade (modern Python 3.14 idioms)
    "B",     # flake8-bugbear (common bug patterns)
    "S101",  # flake8-bandit (prohibits assert in runtime)
    "T20",   # flake8-print (prohibits print in production code)
]
ignore = [
    "E501",  # line length handled by formatter
    "B905",  # zip() strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
"evals/*" = ["S101", "T201"]

[tool.mypy]
python_version = "3.14"
disallow_any_generics = true
disallow_untyped_defs = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "frontmatter.*"]
ignore_missing_imports = true
