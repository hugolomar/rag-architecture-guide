[project]
name = "rag-architecture-guide"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-frontmatter>=1.1",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "testcontainers>=4.15.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern Python 3.14 idioms)
]
